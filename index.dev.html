<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Reference Platform — موسوعة اللغة الإنجليزية</title>
  <meta name="description" content="منصة مرجعية تفاعلية شاملة للغة الإنجليزية: النطق والقراءة والتهجئة (Fundamentals) وقواعد اللغة (Grammar)." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e5a56'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Georgia' font-weight='bold'>E</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/styles/base.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Diagnostic: show the real error instead of a blank page
    (function () {
      function show(msg) {
        var a = document.getElementById('app');
        if (a && !a.children.length) a.innerHTML = '<div dir="ltr" style="font:15px/1.6 sans-serif;max-width:640px;margin:40px auto;padding:20px;border:2px solid #c0392b;border-radius:8px"><b>Startup error</b><br>' + String(msg).replace(/</g, '&lt;') + '<br><br>If the address starts with file:// run a local server: python3 -m http.server 8000, then open http://localhost:8000</div>';
      }
      window.addEventListener('error', function (e) { show(e.message + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
      if (location.protocol === 'file:') show('Opened from file:// - ES modules are blocked by the browser.');
    })();
  </script>
  <script type="module" src="app/main.js"></script>
</body>
</html>
